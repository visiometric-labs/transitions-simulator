<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#070B14" stroke="url(#ringGlow)" stroke-width="3" filter="url(#bloom)" />
  
  <!-- Outer Bevel Ring -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- Iris Lens Core -->
  <circle cx="50" cy="50" r="32" fill="url(#irisGlow)" />
  
  <!-- Internal Pupil & Aperture Arc -->
  <circle cx="50" cy="50" r="16" fill="#030712" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />
  
  <!-- Specular Reflection Sheen -->
  <ellipse cx="43" cy="41" rx="8" ry="4" transform="rotate(-30 43 41)" fill="white" opacity="0.6" filter="url(#bloom)" />
  <circle cx="58" cy="59" r="2.5" fill="#38BDF8" opacity="0.7" />
</svg>
